@keyframes wob{50%{transform:rotate(5deg) scale(1.06)}}
.front h2{margin:4px 0 2px;font-size:1.15rem;color:var(--rouge2)}
.front p{margin:0;font-size:.85rem;color:#5a3a22}
.front small{display:block;margin-top:4px;color:#8a6a4a}
.back{position:absolute;inset:0;transform:rotateY(180deg);background:#fff6b8 repeating-linear-gradient(transparent 0 27px,#9ec3e8 27px 28px);border:3px solid #d8b84a;font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;color:#1f2f8f;text-align:left;overflow:hidden}
.back b{display:block;font-size:1rem;margin-bottom:4px;color:#8a1f1b}
#notetext{font-size:1.05rem;line-height:28px;white-space:pre-wrap}

body.notext .say .who,body.notext .say p,body.notext #bubble{display:none!important}
/* ====== panneau du bas (toujours visible, boutons jamais coupés) ====== */
#panel{flex:0 0 auto;display:flex;flex-direction:column;max-height:42dvh;background:var(--creme);border-top:4px solid var(--or);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.say{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.say .who{font-size:.72rem;font-weight:800;color:var(--rouge2);text-transform:uppercase;letter-spacing:.8px}
.say p{margin:2px 0 0;font-size:1.08rem;line-height:1.3;font-weight:700}
.say .sub{font-weight:400;font-size:.88rem;color:#6a4a32}
.btns{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:6px}
.btns .wide{grid-column:1/-1}
.btn{min-height:52px;padding:8px 10px;border-radius:14px;border:3px solid #b0782e;background:#fff;font-weight:800;font-size:1rem;box-shadow:0 3px 0 #b0782e}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b0782e}
.btn.yes{background:#3fae5f;border-color:#1f7a3b;box-shadow:0 3px 0 #1f7a3b;color:#fff}
.btn.no{background:#e45a4f;border-color:#8a1f1b;box-shadow:0 3px 0 #8a1f1b;color:#fff}
.btn.go{background:var(--rouge);border-color:var(--rouge2);box-shadow:0 3px 0 var(--rouge2);color:#fff;font-size:1.15rem}
.btn.soft{background:#fbe9c2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{padding:9px 13px;min-height:42px;border-radius:999px;border:2px solid #b0782e;background:#fff;font-weight:700}
.chip.on{background:var(--rouge);color:#fff;border-color:var(--rouge2)}
.lab{display:block;margin:6px 0 2px;font-size:.85rem;font-weight:800}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:2px solid #b0782e;font:inherit;background:#fff;-webkit-user-select:text;user-select:text}
.prog{display:flex;gap:4px;margin-top:4px}.prog i{width:14px;height:6px;border-radius:3px;background:#e8cf9c}.prog i.on{background:var(--rouge)}

/* ====== fenêtres (réglages, liste, mise à jour) : toujours défilantes, boutons toujours visibles ====== */
.ov{position:fixed;inset:0;z-index:500;background:rgba(20,8,4,.72);display:flex;align-items:center;justify-content:center;padding:12px}
.dlg{width:min(100%,460px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;background:var(--creme);border:4px solid var(--or);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dlg h2{margin:0;padding:12px 14px 6px;font-size:1.2rem;color:var(--rouge2);flex:0 0 auto}
.dlg-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 10px;font-size:.95rem}
.dlg-body ul{margin:4px 0 4px 18px;padding:0}.dlg-body li{margin:3px 0}
.dlg-foot{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:2px solid #ecd49a}
.dlg-foot .btn{flex:1}
.bar{height:16px;border-radius:8px;background:#ead9b0;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fae5f,#8fe0a6);transition:width .2s}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #d8b87a}
.row .grow{flex:1}
.small{font-size:.8rem;color:#6a4a32}
.toggle{min-width:84px}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #d8b87a}
.li .e{font-size:1.8rem}.li.pr{flex-wrap:wrap}.li.pr .t{flex:1 1 calc(100% - 56px)}.li.pr .btn{flex:1 1 auto}
.li .t{flex:1;font-weight:700}
.confetti{position:absolute;top:-20px;z-index:200;pointer-events:none;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105dvh) rotate(540deg);opacity:.9}}

function yn1(t){t=(t||'').toLowerCase().replace(/[’]/g,"'");
 if(/je (ne )?sais pas|chais pas|sais pas|aucune id[ée]e|sais plus/.test(t))return 'dk';
 if(/plut[oô]t non|pas trop|pas vraiment|bof|pas beaucoup|un peu non|moyen/.test(t))return 'pn';
 if(/plut[oô]t oui|un peu|peut[- ]?[eê]tre|pourquoi pas|assez|si on veut/.test(t))return 'py';
 const neg=/\b(non|nan|nope|jamais|pas du tout|j'aime pas|je n'aime pas|je veux pas|pas envie|beurk|berk)\b/.test(t);
 const pos=/\b(oui|ouais|ouai|ouaip|yep|yes|bien s[uû]r|carr[ée]ment|exactement|tout [àa] fait|absolument|volontiers|[ée]videmment|j'adore|j'aime|trop|grave|d'accord|ok|c'est [çc]a|voil[àa])\b/.test(t);
 if(/j'aime pas|je n'aime pas/.test(t))return 'no';
